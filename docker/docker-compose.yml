services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: firstmud-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "REDACTED_DEV_SA_PASSWORD"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'REDACTED_DEV_SA_PASSWORD' -Q 'SELECT 1' -No -C"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    container_name: firstmud-neo4j
    environment:
      NEO4J_AUTH: "neo4j/REDACTED_DEV_NEO4J_PASSWORD"
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"   # Browser UI
      - "7687:7687"   # Bolt protocol
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  gameserver:
    build:
      context: ..
      dockerfile: src/FirstMud.GameServer/Dockerfile.dev
    container_name: firstmud-gameserver
    depends_on:
      sqlserver:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:5000"
      ConnectionStrings__GameDb: "Server=sqlserver,1433;Database=FirstMud;User Id=sa;Password=REDACTED_DEV_SA_PASSWORD;TrustServerCertificate=True;"
      Neo4j__Uri: "bolt://neo4j:7687"
      Neo4j__Username: "neo4j"
      Neo4j__Password: "REDACTED_DEV_NEO4J_PASSWORD"
    ports:
      - "5000:5000"
    volumes:
      # Mount the whole solution so dotnet watch sees file edits on the host
      - ..:/src
      # Keep bin/obj inside the container (anonymous volumes) so Windows
      # host files don't clash with Linux build output
      - /src/src/FirstMud.GameServer/bin
      - /src/src/FirstMud.GameServer/obj
      - /src/src/FirstMud.Infrastructure/bin
      - /src/src/FirstMud.Infrastructure/obj
      - /src/src/FirstMud.Application/bin
      - /src/src/FirstMud.Application/obj
      - /src/src/FirstMud.Domain/bin
      - /src/src/FirstMud.Domain/obj
      - /src/tests/FirstMud.Tests/bin
      - /src/tests/FirstMud.Tests/obj

  client:
    build:
      context: ../src/FirstMud.Client
      dockerfile: Dockerfile.dev
    container_name: firstmud-client
    depends_on:
      - gameserver
    environment:
      # Docker volume mounts on Windows don't emit inotify events — force
      # Vite/chokidar to poll so file edits trigger HMR.
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "500"
      WATCHPACK_POLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ../src/FirstMud.Client:/app
      # Anonymous volume preserves node_modules installed inside the image
      - /app/node_modules

  e2e:
    # On-demand Playwright test runner. Not started by `up` — run with:
    #   docker compose -f docker/docker-compose.yml run --rm e2e
    # Uses the official MS Playwright image which has Chromium pre-installed.
    image: mcr.microsoft.com/playwright:v1.55.0-noble
    profiles: ["e2e"]
    container_name: firstmud-e2e
    depends_on:
      - client
      - gameserver
    working_dir: /e2e
    environment:
      BASE_URL: "http://client:5173"
      CI: "true"
    volumes:
      - ../tests/FirstMud.E2E:/e2e
      # Anonymous volume preserves node_modules installed inside the
      # container so host (Windows) paths don't shadow them.
      - /e2e/node_modules
    command: sh -c "npm install --no-audit --no-fund && npx playwright test"

volumes:
  sqlserver_data:
  neo4j_data:
  neo4j_logs:
